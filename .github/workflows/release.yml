name: release

# Triggered by pushing a `v*` tag. Builds the console + desktop matrix in
# parallel across 3 host runners, then aggregates everything into a GitHub
# Release with a SHA256SUMS file the in-app UpdaterService verifies
# downloads against.
#
# Manual trigger via workflow_dispatch is supported for testing without
# cutting a real tag — `gh workflow run release.yml -f version=v0.2.0-test`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g. v0.2.0-test)"
        required: true
        default: "v0.0.0-test"

# Resolved once and threaded through the matrix so all jobs agree on the
# label. On a real tag push it's `${{ github.ref_name }}`; on manual
# dispatch it's the input.
#
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 opts every Node-based action into the
# Node 24 runtime ahead of GitHub's 2026-06-02 forcing date. We bump
# actions/checkout, actions/upload-artifact, actions/download-artifact,
# and softprops/action-gh-release to native Node 24 majors below;
# mlugg/setup-zig and subosito/flutter-action still pin `using: node20`
# in their action.yml, so this env var carries them through.
env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Default the GITHUB_TOKEN to read-only; the aggregate-and-publish job
# overrides this to `contents: write` for the release upload step.
permissions:
  contents: read

jobs:
  console:
    name: console (cross-compile via Zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Build console archives
        run: bash scripts/release-01-console.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: console
          path: releases/console/*
          retention-days: 7

  desktop-linux:
    name: desktop (linux-x86_64)
    # ubuntu-22.04 → glibc 2.35; runs on anything from 2022+. Pinning
    # explicitly so we don't accidentally bump the glibc baseline when
    # `ubuntu-latest` rolls forward.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned for reproducible release builds (matches CI). Bump deliberately.
          flutter-version: 3.47.0
          channel: stable
      - name: Install Linux desktop deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev liblzma-dev dpkg-dev \
              libstdc++-12-dev fuse libfuse2
      - name: Build desktop archives
        run: bash scripts/release-02-desktop.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-linux
          path: releases/desktop/*
          retention-days: 7

  desktop-windows:
    name: desktop (windows-x86_64)
    runs-on: windows-latest
    defaults:
      run:
        # release-02-desktop.sh is bash; Git Bash ships with windows-latest.
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned for reproducible release builds (matches CI). Bump deliberately.
          flutter-version: 3.47.0
          channel: stable
      - name: Install NSIS
        run: |
          choco install nsis -y
          echo 'C:\Program Files (x86)\NSIS\Bin' >> $GITHUB_PATH
      - name: Build desktop archives
        run: bash scripts/release-02-desktop.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-windows
          path: releases/desktop/*
          retention-days: 7

  desktop-macos:
    name: desktop (macos-aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned for reproducible release builds (matches CI). Bump deliberately.
          flutter-version: 3.47.0
          channel: stable
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build desktop archives
        run: bash scripts/release-02-desktop.sh "$RELEASE_VERSION"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: desktop-macos
          path: releases/desktop/*
          retention-days: 7

  release:
    name: aggregate + publish release
    needs: [console, desktop-linux, desktop-windows, desktop-macos]
    runs-on: ubuntu-latest
    # Gated environment holding the minisign signing secrets, restricted to
    # `v*` tags so the signing key is only reachable from real releases.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Download all artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: artifacts
      - name: Flatten + checksum
        run: |
          mkdir -p staging
          find artifacts -type f \
              \( -name 'bxp-console-*' -o -name 'bxp-desktop-*' \) \
              -exec cp {} staging/ \;
          bash scripts/release-03-checksums.sh staging > staging/SHA256SUMS
          # Re-verify every hash + assert the manifest is non-empty before we
          # sign + upload, so a truncated/corrupt artifact fails loudly here.
          bash scripts/release-03-checksums.sh --check staging staging/SHA256SUMS
          ls -lh staging
      # Sign SHA256SUMS with minisign so the in-app updater can verify the
      # checksum manifest is authentic (defends a leaked upload token — a
      # forged installer + matching SUMS can't produce a valid signature
      # without the private key). Uses the maintainer's single minisign key
      # (shared across repos) supplied via repo secrets. Skipped — not failed —
      # when the secret is absent, so releases still publish before the key
      # is wired up; once MINISIGN_KEY is set the .minisig is produced and
      # uploaded with staging/* automatically.
      - name: Detect signing key
        id: signing
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          if [ -n "$MINISIGN_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # Real tag release: the client updater is fail-closed and refuses
            # an unsigned release for 100% of users. Publishing one would
            # silently brick the whole auto-update channel — so refuse here
            # rather than ship a release nobody can install.
            echo "::error::MINISIGN_KEY not set on a tag release — refusing to publish an unsigned release (clients fail-closed reject it)"
            exit 1
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MINISIGN_KEY not set — skipping SHA256SUMS signing (workflow_dispatch test run)"
          fi
      - name: Sign SHA256SUMS (minisign)
        if: steps.signing.outputs.enabled == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key"
          echo "$MINISIGN_PASSWORD" | \
            minisign -S -s "$RUNNER_TEMP/minisign.key" -m staging/SHA256SUMS
          rm -f "$RUNNER_TEMP/minisign.key"
          ls -lh staging/SHA256SUMS.minisig
      # Extract the latest CHANGELOG.md entry (between the first two `## 2026`
      # headings, with the heading line itself stripped) for use as the
      # release body. CHANGELOG.md is the single source of truth — using
      # `generate_release_notes: true` produced an empty body because the
      # repo doesn't use PRs.
      - name: Extract release notes from CHANGELOG.md
        run: |
          awk '/^## [0-9][0-9][0-9][0-9]\./{i++; if(i==2) exit; if(i==1) next} i==1' \
              CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::release_notes.md is empty — CHANGELOG.md heading pattern did not match"
          fi
          echo "--- release_notes.md preview (first 20 lines) ---"
          head -20 release_notes.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          body_path: release_notes.md
          files: |
            staging/*

  # Post-publish smoke: re-fetch the published release and assert the
  # checksum manifest is present and lists every desktop installer, so a
  # broken release surfaces here rather than in a user's failed auto-update.
  verify-release:
    name: verify published release
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - name: Check manifest + installer assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_VERSION"
          tmp=$(mktemp -d)
          gh release download "$tag" -R "$GITHUB_REPOSITORY" \
              -p 'SHA256SUMS*' -D "$tmp"
          if [ ! -f "$tmp/SHA256SUMS" ]; then
            echo "::error::SHA256SUMS missing from release $tag"
            exit 1
          fi
          for asset in \
              bxp-desktop-windows-x86_64.exe \
              bxp-desktop-macos-arm64.dmg \
              bxp-desktop-linux-x86_64.AppImage; do
            pat="  ${asset//./\\.}\$"
            if ! grep -qE "$pat" "$tmp/SHA256SUMS"; then
              echo "::error::$asset has no line in SHA256SUMS"
              exit 1
            fi
          done
          # A real tag release must be signed (the client rejects unsigned
          # releases), so a missing signature is a hard failure on push; a
          # workflow_dispatch test run may legitimately be unsigned → warn.
          if [ ! -f "$tmp/SHA256SUMS.minisig" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::SHA256SUMS.minisig missing — a tag release must be signed (clients fail-closed reject unsigned)"
              exit 1
            fi
            echo "::warning::SHA256SUMS.minisig missing — release is unsigned (workflow_dispatch test run)"
          fi
          echo "release $tag: SHA256SUMS present, all desktop installers listed"
