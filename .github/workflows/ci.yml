name: ci

# Runs the full local test suite (scripts/test.sh) on every pull request and
# on pushes to master, across the same three host OSes the release matrix
# targets. The release workflow (.github/workflows/release.yml) only fires on
# a v* tag, so without this PRs and master pushes would go untested by CI.
#
# Windows-runner portability of test.sh was cleared 2026-06-07 (flutter tests
# resolve .exe/.dll/bin + path separators per-platform; the expr corpus is
# pinned eol=lf in .gitattributes; the bench guard SKIPs gracefully on hosts
# without GNU time). macOS likewise SKIPs the bench guard (BSD time has no
# `-f`); the perf invariants run on the Linux leg.
#
# The "release: prepare X.Y.Z" commit (emitted by scripts/release-changelog.sh)
# is skipped here: it only bumps the six manifest version strings + CHANGELOG.md,
# so it changes no code the test suite could exercise, and the v* tag pushed
# right after it triggers the full release build anyway. Re-testing it would
# double the CI fan-out for one release. This relies on the release procedure
# pushing code to master (and letting CI go green) BEFORE cutting the release —
# see docs/release.md. We cannot use a `[skip ci]` commit marker for this: the
# tag points at the same commit, and the marker would skip release.yml too.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push to the same ref cancels an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Opt every Node-based action into the Node 24 runtime (matches release.yml).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    # Skip the redundant run on the version-only "release: prepare" commit
    # (see header). PRs / workflow_dispatch have no head_commit → always run.
    if: "${{ !startsWith(github.event.head_commit.message, 'release: prepare ') }}"
    strategy:
      # Keep all three legs running so one platform's failure doesn't mask
      # another's — no per-OS phase carve-outs, every leg runs the same
      # scripts/test.sh and each phase self-selects where it can run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # One shared Zig cache dir for the whole job. Each test-NN phase cd's into
      # its own package, so without a fixed absolute path the local cache would
      # fragment per-package and never reuse compiled bxp-core modules.
      ZIG_LOCAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-cache
    defaults:
      run:
        # test.sh and the test-NN-*.sh phases are bash; Git Bash ships with
        # windows-latest and bash is the default shell on linux/macos.
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # Persist the build cache ourselves (next step) instead. mlugg's
          # built-in cache only kept a partial subset (~137 MB of a ~1.1 GB
          # build cache — the compiled `o/` outputs were dropped), so every run
          # recompiled the whole ReleaseSafe gate from scratch (~5 min of the
          # ~9 min wall). The Zig toolchain download stays cached regardless.
          use-cache: false
      - name: Cache Zig build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.zig-cache
          # Source hash keys the exact-match entry; restore-keys fall back to the
          # newest prior cache so Zig recompiles only what changed (incremental).
          # The `base` token is a cache epoch tied to the gate's build flags
          # (-Dcpu=baseline): the Zig cache key embeds the CPU, so a cache built
          # under different flags can never hit. Bump the token (base2, …) if the
          # gate's optimize/cpu/target ever changes, to discard the stale caches.
          key: zig-${{ runner.os }}-base-${{ hashFiles('bxp-core/**/*.zig', 'bxp-cli/**/*.zig', 'bxp-mcp/**/*.zig', 'bxp-gui-bridge/**/*.zig', '**/build.zig.zon') }}
          restore-keys: |
            zig-${{ runner.os }}-base-
      - uses: subosito/flutter-action@v2
        with:
          # Pinned (not floating `channel: stable`) so CI is reproducible: the
          # stable channel drifts ahead of local SDKs and surfaces fresh `info`
          # lints that fail CI while passing locally. Bump deliberately. `cache`
          # persists the SDK across runs (~60 s/run); the pin keeps that key
          # stable. (roadmap → CI hardening)
          flutter-version: 3.44.2
          channel: stable
          cache: true
      # A fresh checkout has no .dart_tool. The flutter phases imply a pub
      # get, but json5_ast's standalone `dart test` does not, so resolve
      # both explicitly to keep the run deterministic.
      - name: Resolve Dart/Flutter packages
        run: |
          (cd bxp-gui && flutter pub get)
          (cd bxp-gui/packages/json5_ast && dart pub get)
      - name: Run test suite
        run: bash scripts/test.sh
