name: debug-gui

# Manual debug build of bxp-gui for Windows. Produces a workflow
# artifact (no GitHub Release, no tag, no installer) that contains the
# Flutter Windows bundle. Used when iterating on a Windows-only bug
# without burning a real release tag for each test cycle.
#
# How to use:
#   1. Run via Actions UI or `gh workflow run debug-gui.yml -f label=...`
#   2. Wait for it to finish (~5 min).
#   3. Download the `bxp-gui-windows-debug-<label>` artifact zip.
#   4. Stop the installed BXP, replace bxp-gui.exe + flutter_windows.dll
#      + the data/ folder under "C:\Program Files\BXP\" with the files
#      from the zip. Leave bxp-cli.exe / bxp-fmt.exe / icons untouched
#      (they ship from the official installer).

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'Short label for this build (filename suffix)'
        required: false
        default: 'debug'

permissions:
  contents: read

jobs:
  build-windows-gui:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # Companions are required for the Flutter CMake step to succeed
      # (CMakeLists.txt copies them into the bundle); we discard them
      # afterwards so the artifact stays GUI-only.
      - name: Build companion binaries + bridge DLL (windows target)
        run: |
          (cd bxp-cli         && zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSmall)
          (cd bxp-fmt         && zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSmall)
          (cd bxp-gui-bridge  && zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSmall)
      - name: Build Flutter Windows bundle
        run: |
          cd bxp-gui
          flutter pub get
          flutter build windows --release
      - name: Stage GUI-only payload + bridge DLL
        run: |
          mkdir -p staging
          cp -r bxp-gui/build/windows/x64/runner/Release/* staging/
          # Drop companions: the user's installed BXP already has them
          # (and these were rebuilt only to satisfy the bundle copy step).
          rm -f staging/bxp-cli.exe staging/bxp-fmt.exe
          # Ship the bridge DLL — bxp_process_client.findBridgeLibrary()
          # looks for it next to bxp-gui.exe, the install will be missing
          # it from the older v0.2.1 installer so we need to drop it in.
          cp bxp-gui-bridge/zig-out/bin/bxp-gui-bridge.dll staging/
          ls -lh staging
      - uses: actions/upload-artifact@v4
        with:
          name: bxp-gui-windows-debug-${{ github.event.inputs.label }}
          path: staging/*
          retention-days: 7
