name: bxp_gui
description: A sample command-line application.
version: 0.3.0
publish_to: none
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.11.5

# Add regular dependencies here.
dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  path: ^1.9.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  split_view: ^3.2.2
  package_info_plus: ^10.0.0
  pluto_grid: ^8.1.0
  pluto_menu_bar: ^3.0.1
  flex_seed_scheme: ^4.0.1
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  mcp_dart: ^2.2.0
  # Flutter 3.47 split Material out of the SDK into a standalone package.
  # At 0.0.1 it is a pure facade — a single `export
  # 'package:flutter/material.dart'` — so importing it changes nothing that
  # runs today; what it buys is that the imports already point where the
  # implementation is going before the SDK copies are formally deprecated
  # (planned for the November 2026 stable). Pinned like every other dep:
  # a version move is a deliberate edit, not a silent resolve.
  material_ui: ^0.0.1
  json5_ast:
    path: packages/json5_ast

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  uses-material-design: true
  # Bundled Roboto — single source of truth for text metrics across
  # Linux/macOS/Windows. Without it each platform falls back to its
  # own system sans (DejaVu / SF Pro / Segoe UI) with different glyph
  # widths and fixed-width slots tuned on one platform overflow on
  # another.
  #
  # Five static weight files (300/400/500/600/700) — the canonical
  # Roboto distribution doesn't ship as a plain-weight variable;
  # Roboto Flex is variable but ~1.8 MB and carries axes we don't use.
  #
  # Source: fonts.google.com/specimen/Roboto (Apache-2.0).
  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Light.ttf
          weight: 300
        - asset: fonts/Roboto-Regular.ttf
          weight: 400
        - asset: fonts/Roboto-Medium.ttf
          weight: 500
        - asset: fonts/Roboto-SemiBold.ttf
          weight: 600
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
