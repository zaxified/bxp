site_name: BXP — Broker eXchange Parser
site_description: Convert broker export statements into portfolio-tracker CSV via declarative JSON5 templates.
site_url: https://zaxified.github.io/bxp/
repo_url: https://github.com/zaxified/bxp
repo_name: zaxified/bxp
docs_dir: docs
site_dir: site
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs        # top-level parts as tabs (Guide | Reference | …)
    - navigation.tabs.sticky # keep the tab row pinned so the header stays a
                             # constant 96px — a fixed height gives the sticky
                             # left sidebar a stable anchor, so it scrolls 1:1
                             # instead of jerking as a collapsing header would.
    - navigation.sections
    - navigation.indexes     # a section landing page = index.md
    - navigation.instant     # SPA-like nav — you don't lose your place
    - navigation.instant.prefetch  # fetch the link target on hover
    - navigation.instant.progress  # top progress bar on slow loads
    - navigation.tracking    # URL anchor follows the scrolled-to heading
    - navigation.top         # back-to-top button
    - toc.integrate          # fold the page TOC into the left nav (no right column)
    - search.suggest
    - search.highlight
    - search.share           # shareable deep link to a search query
    - content.code.copy
    - content.code.annotate  # numbered annotations inside code samples
    - content.tabs.link      # linked content tabs sync across the page
  # Click the header palette icon to cycle through these complete themes. The
  # first two are Material's own light/dark; the rest are coordinated community
  # palettes defined in docs/assets/stylesheets/palettes.css. Add/remove entries
  # freely — each `scheme` name just has to match a block in that file (the two
  # built-ins need no CSS). The choice is remembered in the browser.
  palette:
#    - scheme: default
#      toggle:
#        icon: material/brightness-7
#        name: "Theme: Light (click to cycle)"
#    - scheme: slate
#      toggle:
#        icon: material/brightness-4
#        name: "Theme: Dark (click to cycle)"
    - scheme: vscode-dark
      toggle:
        icon: material/brightness-4
        name: "Theme: VS Code Dark (click to cycle)"
    - scheme: vscode-light
      toggle:
        icon: material/brightness-7
        name: "Theme: VS Code Light (click to cycle)"

markdown_extensions:
  - admonition
  - pymdownx.details        # `???`/`???+` collapsible admonitions (pairs with admonition)
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - abbr                      # glossary terms → hover tooltips (no navigation)
  - pymdownx.snippets:
      base_path:
        - docs            # resolve --8<-- includes against docs/ (examples data, includes)
      check_paths: true   # fail the build on a missing snippet instead of silently empty
      auto_append:
        - includes/abbreviations.md
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:        # :material-*: / :octicons-*: inline icons (GitHub mark, etc.)
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid       # render ```mermaid fenced blocks
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

not_in_nav: |
  /includes/

# Example dirs are migrated whole (config + inputs + goldens) so each page stays
# runnable from disk and browsable on GitHub. Keep the engine output / golden /
# fetch artefacts OUT of the published site — only the prose + sample inputs ship.
exclude_docs: |
  examples/**/*.csvx
  examples/**/*.expected
  examples/**/*.sh
  examples/**/.gitkeep
  examples/**/1-*
  examples/**/full/
  examples/**/*.zip
  examples/**/*.xlsx
  examples/CLAUDE.md
  # Committed pipeline intermediates. Excluded because the page already embeds
  # them where they explain something, not because output is unwelcome on the
  # site — a standalone copy at its own URL is simply a second copy of bytes the
  # reader has already been shown, and nothing links to it. The suffixes are
  # what makes them matchable (`xlsx_sheet.output_suffix` is spelled
  # `.sheet.csv` precisely so this rule can name it).
  examples/**/*.sheet.csv
  examples/**/*.part.csv
  examples/**/*.unified.csv

plugins:
  - search
  - glightbox            # click-to-zoom for screenshots / the demo GIF
  - social               # auto-generated Open Graph preview cards

extra_css:
  - assets/stylesheets/palettes.css
  - assets/stylesheets/extra.css
  - assets/stylesheets/playground.css

extra_javascript:
  - assets/javascripts/tablesort.min.js
  - assets/javascripts/tables.js
  # Live expression playground. The .wasm it drives is a build artifact, not a
  # tracked file — run `bash scripts/gen-wasm-playground.sh` before building the
  # site, or the widget reports that it could not load the engine.
  - assets/javascripts/playground.js

