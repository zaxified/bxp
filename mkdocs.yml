site_name: BXP — Broker eXchange Parser
site_description: Convert broker export statements into portfolio-tracker CSV via declarative JSON5 templates.
site_url: https://zaxified.github.io/bxp/
repo_url: https://github.com/zaxified/bxp
repo_name: zaxified/bxp
docs_dir: docs
site_dir: site
edit_uri: edit/master/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs        # top-level parts as tabs (Guide | Reference | …)
    - navigation.tabs.sticky # keep the tab row pinned so the header stays a
                             # constant 96px — a fixed height gives the sticky
                             # left sidebar a stable anchor, so it scrolls 1:1
                             # instead of jerking as a collapsing header would.
    - navigation.sections
    - navigation.indexes     # a section landing page = index.md
    - navigation.instant     # SPA-like nav — you don't lose your place
    - navigation.instant.prefetch  # fetch the link target on hover
    - navigation.instant.progress  # top progress bar on slow loads
    - navigation.tracking    # URL anchor follows the scrolled-to heading
    - navigation.top         # back-to-top button
    - toc.integrate          # fold the page TOC into the left nav (no right column)
    - search.suggest
    - search.highlight
    - search.share           # shareable deep link to a search query
    - content.code.copy
    - content.code.annotate  # numbered annotations inside code samples
    - content.tabs.link      # linked content tabs sync across the page
  # Click the header palette icon to cycle through these complete themes. The
  # first two are Material's own light/dark; the rest are coordinated community
  # palettes defined in docs/assets/stylesheets/palettes.css. Add/remove entries
  # freely — each `scheme` name just has to match a block in that file (the two
  # built-ins need no CSS). The choice is remembered in the browser.
  palette:
#    - scheme: default
#      toggle:
#        icon: material/brightness-7
#        name: "Theme: Light (click to cycle)"
#    - scheme: slate
#      toggle:
#        icon: material/brightness-4
#        name: "Theme: Dark (click to cycle)"
    - scheme: vscode-dark
      toggle:
        icon: material/brightness-4
        name: "Theme: VS Code Dark (click to cycle)"
    - scheme: vscode-light
      toggle:
        icon: material/brightness-7
        name: "Theme: VS Code Light (click to cycle)"

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - abbr                      # glossary terms → hover tooltips (no navigation)
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid       # render ```mermaid fenced blocks
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

not_in_nav: |
  /includes/

plugins:
  - search
  - glightbox            # click-to-zoom for screenshots / the demo GIF
  - social               # auto-generated Open Graph preview cards

extra_css:
  - assets/stylesheets/palettes.css
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/tablesort.min.js
  - assets/javascripts/tables.js

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/install.md
      - getting-started/first-conversion.md
      - getting-started/built-in-templates.md
  - Guide:
      - guide/templates.md
      - guide/expressions.md
      - guide/dates.md
      - guide/numbers-and-encoding.md
      - guide/cross-row-joins.md
      - guide/row-routing.md
      - guide/targets.md
      - guide/running.md
  - AI Workflow:
      - ai/authoring-a-broker.md
      - ai/gui-mcp.md
      - ai/handoff.md
  - GUI:
      - gui/features.md
      - gui/preferences.md
      - gui/updates.md
      - gui/troubleshooting.md
  - Developer:
      - dev/build.md
      - dev/testing.md
      - dev/debugging.md
      - Internals:
          - dev/internals/index.md
          - dev/internals/modules.md
          - dev/internals/implementation.md
          - dev/internals/howto.md
          - dev/internals/performance.md
      - Architecture:
          - dev/architecture/index.md
          - dev/architecture/pipeline.md
          - dev/architecture/gui.md
          - dev/architecture/data-structures.md
      - GUI internals:
          - dev/gui/index.md
          - dev/gui/setup.md
          - dev/gui/architecture.md
          - dev/gui/subprocess.md
          - dev/gui/agent.md
          - dev/gui/patterns.md
      - dev/mcp.md
      - Trace protocol:
          - dev/trace-protocol/index.md
          - dev/trace-protocol/bxtb.md
          - dev/trace-protocol/inspect.md
      - dev/release.md
      - dev/roadmap.md
  - Reference:
      - reference/expr-functions.md
      - reference/config-schema.md
      - reference/date-tokens.md
      - reference/cli-flags.md
      - reference/mcp-tools.md
      - reference/gui-agent-tools.md
      - reference/gui-shortcuts.md
      - reference/gui-prefs.md
      - reference/exit-codes.md
